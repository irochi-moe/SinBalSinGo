report:
  usage: '<yellow>Usage: /report \<player> [category] [reason]'
  # Categories suggested when players tab-complete /report. Do not use spaces.
  categories:
    - 'profanity'
    - 'family-insult'
    - 'personal-attack'
    - 'hate-speech'
    - 'sexual-harassment'
    - 'spam'
    - 'other'
  # Message when a player reports themselves.
  self: '<red>You can''t report yourself.'
  cooldown: '<red>You''re on report cooldown. Try again in <yellow>{seconds}<red> seconds.'
  # Message when the target has no recent chat history. Don't reveal whether any chat was recorded. Placeholders: {target}
  no-history: '<red>You can''t report this player right now.'

command:
  reload: '<aqua>[SinBalSinGo] <green>Reloaded the config and language files. Discord and punishment changes need a restart.'
  status: '<aqua>[SinBalSinGo] <white>AI <green>{providers}<white> | Discord bot {discord}<white> | Chat history <green>{history}<white> entries'
  status-set: '<green>set'
  status-unset: '<red>not set'
  usage: '<aqua>[SinBalSinGo] <yellow>Usage: /sinbalsingo \<reload|status|export|retry>'

moderation:
  submitted: '<yellow>Your report has been submitted.'
  action-taken: '<green>A player you recently reported has been punished. Thanks for reporting!'
  submission-failed: '<red>Your report couldn''t be submitted. Try again later.'
  admin-queued: '<yellow>Started the task. Check the console log for the result.'
  # Notifications for staff. Turn each on or off with the notify-* settings in config.yml.
  # Placeholders: {target} (reported player), {action} (punishment name), {case} (case ID)
  notify:
    review-pending: '<aqua>[SinBalSinGo] <gray>The report on <white>{target}<gray> is <yellow>awaiting review in Discord<gray>.'
    dismissed: '<aqua>[SinBalSinGo] <gray>The report on <white>{target}<gray> found no violation and was closed.'
    rest-dismissed: '<aqua>[SinBalSinGo] <gray>The rest of the report on <white>{target}<gray> found no violation and was closed with no further punishment.'
    action-running: '<aqua>[SinBalSinGo] <gray>Applying <yellow>{action}<gray> to <white>{target}<gray>.'
    action-taken: '<aqua>[SinBalSinGo] <gray>Applied <green>{action}<gray> to <white>{target}<gray>.'
    automatic-part-taken: '<aqua>[SinBalSinGo] <gray>Automatically applied <green>{action}<gray> to <white>{target}<gray>. The rest is <yellow>awaiting review in Discord<gray>.'
    action-failed: '<aqua>[SinBalSinGo] <red>Couldn''t apply {action} to {target}. Handle it manually.'
    action-unknown: '<aqua>[SinBalSinGo] <red>Couldn''t tell if {action} was applied to {target}. Check in game instead of running it again, or they may be punished twice.'
    assessment-failed: '<aqua>[SinBalSinGo] <red>The AI couldn''t assess the report on {target}. If every retry fails, check the AI settings and run /sinbalsingo retry.'
    delivery-failed: '<aqua>[SinBalSinGo] <red>Couldn''t send the report on {target} to Discord. Check the bot settings and the console log.'
