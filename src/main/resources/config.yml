# 플레이어 언어를 지원하지 않을 때 사용할 언어입니다. ko: 한국어, en: 영어
fallback-language: en

ai:
  # 먼저 사용할 AI입니다. OPENAI 또는 GEMINI
  primary-provider: OPENAI

  # 첫 AI가 실패하면 다른 AI에 요청합니다. 두 곳 모두 키가 있어야 합니다.
  fallback-enabled: true

  # 추론과 답변에 사용할 토큰 제한입니다. 판정이 잘린다는 오류가 나면 늘리세요.
  max-tokens: 8192

  # AI 답변을 기다리는 최대 시간(초)입니다.
  timeout-seconds: 60

  gemini:
    # 발급받은 API 키를 넣으세요. 키가 담긴 설정 파일은 공유하지 마세요.
    api-key: ''
    model: 'gemini-3.8-flash'
    # 추론 수준입니다. low, medium, high 중 선택합니다.
    thinking-level: high
    # 욕설 등 신고 원문을 심사할 수 있도록 Gemini의 내용 차단을 완화합니다.
    safety-block-none: true

  openai:
    # 발급받은 API 키를 넣으세요. 키가 담긴 설정 파일은 공유하지 마세요.
    api-key: ''
    model: 'gpt-6-sol'
    # 추론 수준입니다. 기본값 high로 심사합니다.
    reasoning-effort: high

# 신고 쿨타임(초)입니다. irochi.sinbalsingo.cooldown.bypass 권한으로 우회할 수 있습니다.
report-cooldown-seconds: 60

# GuRoYeokSiBal이 설치되어 있으면 차단 사유를 정확히 구분합니다:
# 쿨타임 차단은 기록하지 않고, 필터 차단은 [필터에 막힘] 표시와 함께 기록합니다.
# 이 설정은 다른 플러그인(뮤트 등)이 막은 채팅·귓속말을 [다른 플러그인이 막음] 표시와 함께 기록할지 정합니다.
log-cancelled-chat: true

# 채팅 기록 보관 설정입니다.
# history-max-entries: 메모리에 보관할 최대 채팅 수
# history-max-age-minutes: 이 시간이 지난 채팅은 판정 근거에서 제외
history-max-entries: 300
history-max-age-minutes: 15

# AI에게 전달할 최대 기록 수입니다. (최근 순)
# 일반 채팅 전체, 신고 대상이 관련된 킬 기록, 신고자와 신고 대상이 주고받은 귓속말이 포함됩니다.
context-max-entries: 30

# PvP 킬 기록(킬러, 피해자, 무기 이름)을 판정 근거에 포함할지 여부입니다.
# 킬 직후 도발의 맥락 파악과, 욕설로 개명된 무기 이름 신고에 사용됩니다.
log-kills: true

# 귓속말로 기록할 명령어 목록입니다. ( / 없이 입력)
# [형식] /명령어 <상대> <내용>
# 같은 명령어를 reply-commands에도 넣을 수 있습니다. (서버마다 역할이 다른 /w 등)
# 이 경우 첫 단어가 온라인 플레이어면 귓속말로, 아니면 답장으로 기록합니다.
whisper-commands:
  - 'msg'
  - 'message'
  - 'tell'
  - 'w'
  - 'whisper'
  - 'pm'
  - 'dm'
  - 'm'

# 귓속말 답장으로 기록할 명령어 목록입니다. ( / 없이 입력)
# [형식] /명령어 <내용> — 상대는 마지막으로 귓속말을 주고받은 플레이어로 추정합니다.
reply-commands:
  - 'r'
  - 'reply'
  - 'w'

# Discord 봇은 플러그인 안에서 실행됩니다. 별도로 켤 프로그램은 없습니다.
discord:
  # Discord 개발자 포털에서 발급받은 봇 토큰을 넣으세요. 토큰이 담긴 설정 파일은 공유하지 마세요.
  token: ''
  # Discord 개발자 모드에서 서버·채널·역할을 우클릭해 ID를 복사하세요.
  guild-id: '' # Discord 서버 ID
  channel-id: '' # 신고를 받을 운영자 전용 텍스트 채널 ID
  moderator-role-ids: [] # 승인 가능한 역할 ID. 예: ['123456789012345678']
  language: ko # Discord 메시지 언어: ko 또는 en (AI 판단 내용은 항상 한국어)

moderation:
  # false: 운영자가 Discord에서 승인해야 조치합니다. true: 허용된 규칙은 자동 조치합니다.
  automatic-enforcement: true
  persistence-directory: cases # 플러그인 폴더 안에 신고를 저장할 폴더
  delete-after-days: 14 # 신고 기록을 보관할 일수. 지나면 사건 파일을 통째로 자동 삭제합니다. Discord 메시지는 남습니다.
  max-attempts: 3 # AI 심사·Discord 전송의 최대 시도 횟수
  retry-seconds: 30 # 실패 후 다시 시도할 간격(초)
  # Discord에 나오는 처벌 버튼입니다. 가벼운 것부터 적으세요.
  # AI가 판단한 심각도(0~100)가 min-severity 이상인 처벌 중 가장 무거운 것을 추천하고, 관리자는 아무 버튼이나 고를 수 있습니다.
  # 명령어는 콘솔에서 실행하며 {target}(닉네임), {uuid}, {reason}(위반한 규칙 이름)을 쓸 수 있습니다.
  # 명령어를 비우면 아무것도 실행하지 않고 위반 판정만 남깁니다.
  # automatic: 자동 조치(automatic-enforcement)가 이 처벌을 실행해도 되는지 여부
  actions:
    - label: '경고'
      command: 'litebans:warn {target} {reason}'
      min-severity: 0
      automatic: true
    - label: '30분 채팅 금지'
      command: 'litebans:tempmute {target} 30m {reason}'
      min-severity: 30
      automatic: true
    - label: '1일 채팅 금지'
      command: 'litebans:tempmute {target} 1d {reason}'
      min-severity: 60
      automatic: false
  # 규칙별 자동 처리 설정입니다. automatic-enforcement가 false면 쓰이지 않습니다.
  # automatic-eligible: 자동 처리 대상으로 검토할지 여부
  # confidence: AI 확신도 기준(0~100). 높아도 근거·예외 확인을 통과해야 자동 처리합니다.
  # R03/R05/R06/R07/R08/R09는 현재 항상 운영자가 검토합니다.
  # 한 신고에 자동 처리할 판단과 검토할 판단이 섞여 있으면, 자동 처리할 판단의 처벌만 먼저 실행하고 나머지는 운영자가 추가 처벌을 정합니다.
  rules:
    R01: { automatic-eligible: true, confidence: 95 } # 욕설
    R02: { automatic-eligible: true, confidence: 95 } # 금지 표현 우회
    R03: { automatic-eligible: false, confidence: 95 } # 인신공격
    R04: { automatic-eligible: true, confidence: 95 } # 가족 모욕
    R05: { automatic-eligible: false, confidence: 95 } # 차별·혐오
    R06: { automatic-eligible: false, confidence: 95 } # 성희롱
    R07: { automatic-eligible: false, confidence: 95 } # 반복 괴롭힘
    R08: { automatic-eligible: false, confidence: 95 } # 금지된 일베식 표현·금지어
    R09: { automatic-eligible: false, confidence: 95 } # 고인 조롱
    R10: { automatic-eligible: true, confidence: 95 } # 종결어미 ~노

# 관리자에게 게임 안에서 알릴 내용입니다. 채팅 원문은 표시하지 않습니다.
notify-yes: true # 위반 확인
notify-no: false # 제재 없이 종료
notify-consider: true # 검토 대기
notify-error: true # 오류 발생
