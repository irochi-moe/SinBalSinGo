name: SinBalSinGo
version: '${version}'
author: Irochi
website: irochi.moe
main: moe.irochi.plugins.sinbalsingo.SinBalSinGo
description: '${description}'
api-version: '1.20'
folia-supported: true
softdepend:
  - GuRoYeokSiBal
libraries:
  - net.dv8tion:JDA:${jdaVersion}

commands:
  report:
    description: 플레이어의 채팅을 신고합니다. (Report a player's chat.)
    permission: irochi.sinbalsingo.use
    aliases:
      - chatreport
  sinbalsingo:
    description: SinBalSinGo의 관리 명령어입니다.
    usage: /sinbalsingo <reload|status|export|retry>
    permission: irochi.sinbalsingo.admin

permissions:
  irochi.sinbalsingo.use:
    description: /report 명령어 사용
    default: true
  irochi.sinbalsingo.notify:
    description: 신고 진행 알림 받기
    default: op
  irochi.sinbalsingo.cooldown.bypass:
    description: 신고 쿨타임 무시
    default: op
  irochi.sinbalsingo.admin:
    description: /sinbalsingo 명령어 사용
    default: op
